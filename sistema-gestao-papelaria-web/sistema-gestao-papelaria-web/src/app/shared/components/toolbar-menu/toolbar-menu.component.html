<mat-toolbar class="toolbar-menu" [class.mat-elevation-z4]="shadow">
  <mat-toolbar-row>
    <!-- LOGO E TÍTULO ADAPTADOS -->
<button mat-icon-button (click)="toggleSidebar()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- LOGO E NOME DO SISTEMA -->
  <a routerLink="/dashboard" class="logo-container">
    <img src="assets/MGC-Logo.png" alt="MGC Logo" class="brand-logo" />
    <span class="brand-title">Sistema de Gestão de Consumos</span>
  </a>

    <!-- MENU DO UTILIZADOR -->
    <button mat-button [matMenuTriggerFor]="menu" class="user-menu-btn">
      <mat-icon>account_circle</mat-icon>
      <span style="margin: 0 8px;">{{ userName }}</span>
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </mat-toolbar-row>
</mat-toolbar>

<!-- SUBMENUS DINÂMICOS -->
<mat-menu #beforeMenu="matMenu">
  <ng-container *ngFor="let item of items_menu">

    <!-- Caso tenha Filhos/Subníveis -->
    <ng-container *ngIf="item.children && item.children.length > 0">
      <button mat-menu-item [matMenuTriggerFor]="subMenu">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </button>

      <mat-menu #subMenu="matMenu">
        <a *ngFor="let child of item.children" mat-menu-item [routerLink]="child.link">
          <mat-icon>{{ child.icon }}</mat-icon>
          <span>{{ child.label }}</span>
        </a>
      </mat-menu>
    </ng-container>

    <!-- Caso seja item simples -->
    <a *ngIf="!item.children" mat-menu-item [routerLink]="item.link" routerLinkActive="active">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>

  </ng-container>
</mat-menu>

<!-- MENU DE PERFIL DO UTILIZADOR -->
<mat-menu #menu="matMenu">
  <a routerLink="/users/myProfile" mat-menu-item>
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </a>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon class="logout-icon">logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
